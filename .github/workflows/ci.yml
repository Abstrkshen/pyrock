name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Python with a shared libpython
        run: sudo apt-get update && sudo apt-get install -y python3-dev python3-venv xvfb libgl1-mesa-dri
      - name: Unit and suite tests
        run: cargo test --workspace
      - name: Samples vs CPython
        run: bash samples/run_all.sh
      - name: Demos (backend, AI, GUI physics) vs expected output
        run: bash demos/run_all.sh
      - name: GUI demo virtualenv (raylib)
        run: python3 -m venv demos/gui/.venv && demos/gui/.venv/bin/pip install raylib
      - name: README commands, verbatim (GUI under a virtual display)
        run: xvfb-run -a bash scripts/readme_check.sh
