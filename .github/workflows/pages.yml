name: pages

# Publishes site/ to the gh-pages branch, which GitHub Pages serves at
# https://abstrkshen.github.io/pyrock/ . scripts/build_site.sh adds the
# playground's compiler (crates/playground as WebAssembly) and its programs
# (examples/playground), so a change to either redeploys the site.
on:
  push:
    branches: [main]
    paths: ["site/**", "crates/**", "examples/playground/**", "scripts/build_site.sh", "Cargo.lock", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build the playground (compiler as WebAssembly, example programs)
        run: bash scripts/build_site.sh
      - name: Push site/ to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp -r site "$RUNNER_TEMP/site"
          cd "$RUNNER_TEMP/site"
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish site from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
