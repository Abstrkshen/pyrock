[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyrock-frontend = { path = "crates/frontend" }
pyrock-ir = { path = "crates/ir" }
pyrock-infer = { path = "crates/infer" }
pyrock-analysis = { path = "crates/analysis" }
pyrock-codegen-rust = { path = "crates/codegen-rust" }
