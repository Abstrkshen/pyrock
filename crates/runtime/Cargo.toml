[package]
name = "pyrock-runtime"
version.workspace = true
edition.workspace = true

[features]
# Embed CPython (only enabled for programs that cross a Python boundary).
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", optional = true }
# Stackful coroutines: generators (`yield`) and `async def` bodies that
# suspend at `await` of a Python awaitable.
corosensei = "0.3"
